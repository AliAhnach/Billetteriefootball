<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b22">
    <title>Créer un compte — FootTickets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <header class="auth-header">
        <a class="brand" href="index.html" aria-label="FootTickets, accueil"><img class="brand-logo" src="images/logo-transparent.png" alt=""><span>Foot<span class="brand-accent">Tickets</span></span></a>
        <a class="back-home" href="index.html">← Retour à l’accueil</a>
    </header>
    <main class="auth-main">
        <section class="auth-card" aria-labelledby="register-title">
            <h1 id="register-title" class="auth-title">Créer un compte</h1>
            <p class="auth-intro">Créez votre compte pour réserver vos places en quelques instants.</p>
            <form class="auth-form" action="#" method="post">
                <div class="form-name-row">
                    <div><label for="first-name">Prénom</label><input id="first-name" name="firstName" type="text" autocomplete="given-name" placeholder="Votre prénom" required></div>
                    <div><label for="last-name">Nom</label><input id="last-name" name="lastName" type="text" autocomplete="family-name" placeholder="Votre nom" required></div>
                </div>
                <label for="email">Adresse e-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required>
                <label for="password">Mot de passe</label>
                <div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8 caractères minimum" required><button class="password-toggle" type="button" aria-controls="password" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M4 20 20 4"/></svg></button></div>
                <label for="password-confirm">Confirmer le mot de passe</label>
                <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" placeholder="Répétez votre mot de passe" required>
                <button class="auth-submit" type="submit">Créer mon compte</button>
            </form>
            <p class="auth-switch">Vous avez déjà un compte ? <a href="login.html">Se connecter</a></p>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
