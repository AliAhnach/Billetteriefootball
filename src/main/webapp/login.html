<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b22">
    <title>Connexion — FootTickets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <header class="auth-header">
        <a class="brand" href="index.html" aria-label="FootTickets, accueil"><img class="brand-logo" src="images/logo-transparent.png" alt=""><span>Foot<span class="brand-accent">Tickets</span></span></a>
        <a class="back-home" href="index.html">← Retour à l’accueil</a>
    </header>
    <main class="auth-main">
        <section class="auth-card" aria-labelledby="login-title">
            <h1 id="login-title" class="auth-title">Connexion</h1>
            <p class="auth-intro">Connectez-vous pour retrouver vos réservations et vos billets.</p>
            <form class="auth-form" action="#" method="post">
                <label for="email">Adresse e-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required>
                <div class="label-row"><label for="password">Mot de passe</label><a href="#">Mot de passe oublié ?</a></div>
                <div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required><button class="password-toggle" type="button" aria-controls="password" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M4 20 20 4"/></svg></button></div>
                <button class="auth-submit" type="submit">Se connecter</button>
            </form>
            <p class="auth-switch">Vous n’avez pas encore de compte ? <a href="register.html">Créer un compte</a></p>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
